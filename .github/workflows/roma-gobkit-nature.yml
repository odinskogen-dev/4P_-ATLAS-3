name: CUB ROMA New Real CC0 Nature Models
on:
  push:
    branches: [cub-roma-world-assets-20261023]
    paths:
      - 'tools/roma_gobkit_nature_20261023.py'
      - '.github/workflows/roma-gobkit-nature.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/roma_gobkit_nature_20261023.py
      - uses: actions/upload-artifact@v4
        with:
          name: CUB_ROMA_GOBKIT_REAL_38_CC0_NATURE
          path: assets/roma_gobkit_nature_cc0/
          if-no-files-found: error
          retention-days: 30

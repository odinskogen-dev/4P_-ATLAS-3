name: ROMA R6 NASA D1 132 TILES (private artifact)
on:
  push:
    branches:
      - cub-roma-r6-nasa-private-artifact-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Download original NASA asset from existing verified CUB release
        run: |
          curl -fL --retry 3 --output /tmp/original.zip 'https://github.com/odinskogen-dev/4P_-ATLAS-3/releases/download/roma-geo-round4/ROMA_R4_NASA_CC0_ORIGINALS.zip'
          echo '6775476fb9e683628f0cc2a00f1707bf3ecad5a8215c731eeb2c81d88fcec474  /tmp/original.zip' | sha256sum -c
          unzip -Z1 /tmp/original.zip | grep -Ei 'D1\.jpg$' >/tmp/names
          test "$(wc -l </tmp/names)" -eq 1
          unzip -p /tmp/original.zip "$(cat /tmp/names)" > /tmp/d1.jpg
      - name: Crop only genuine source pixels for longitude 90–150.5 E
        shell: bash
        run: |
          cat >/tmp/tiles.py <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json,zipfile,os
          Image.MAX_IMAGE_PIXELS=None
          src=Image.open('/tmp/d1.jpg')
          assert src.size == (21600,21600),src.size
          assert src.format=='JPEG'
          dst=Path('/tmp/output'); (dst/'tiles').mkdir(parents=True,exist_ok=True)
          manifest=[]
          for row in range(12):
              y0=round((90-(66-row*61/12))*240)
              y1=round((90-(66-(row+1)*61/12))*240)
              for col in range(20,31):
                  x0=round((-20+col*5.5-90)*240)
                  x1=round((-20+(col+1)*5.5-90)*240)
                  assert 0<=x0<x1<=21600 and 0<=y0<y1<=21600
                  tile=src.crop((x0,y0,x1,y1))
                  if tile.size!=(1320,1220):
                      tile=tile.resize((1320,1220),Image.Resampling.LANCZOS)
                  path=dst/'tiles'/f'r{row}c{col}.jpg'
                  tile.save(path,'JPEG',quality=87,subsampling=0,optimize=True)
                  assert Image.open(path).size==(1320,1220)
                  manifest.append({'file':'tiles/'+path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size,'w':1320,'h':1220,'row':row,'column':col})
          assert len(manifest)==132 and len(set(m['file'] for m in manifest))==132
          (dst/'R6_NASA_D1_NEW_TILES_MANIFEST.json').write_text(json.dumps({'source':'NASA BMNG July 2004 D1 northern eastern hemisphere; existing 240 tiles must be preserved','count':132,'original_r4_sha256':'6775476fb9e683628f0cc2a00f1707bf3ecad5a8215c731eeb2c81d88fcec474','tiles':manifest},indent=2))
          with zipfile.ZipFile('/tmp/ROMA_R6_NASA_D1_132_TILES.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(dst.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(dst))
          p=Path('/tmp/ROMA_R6_NASA_D1_132_TILES.zip')
          (dst/'CHECKSUMS.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print('verified 132 source-backed images; zip size',p.stat().st_size,'sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python /tmp/tiles.py
      - uses: actions/upload-artifact@v4
        with:
          name: ROMA_R6_NASA_D1_132_NEW_TILES
          path: |
            /tmp/ROMA_R6_NASA_D1_132_TILES.zip
            /tmp/output/CHECKSUMS.sha256
          retention-days: 30

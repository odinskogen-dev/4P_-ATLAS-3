name: ROMA NASA July 500m ORIGINALS B1 C1
on:
  push:
    branches: [cub-roma-world-assets-20261023]
    paths: ['.github/workflows/cub-roma-nasa-originals.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-nasa-exact-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python image verifier
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download unmodified NASA source JPGs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request,os
          from pathlib import Path
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          root=Path("nasa_originals")
          root.mkdir(exist_ok=True)
          base="https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/july/"
          data={"dataset":"NASA Blue Marble Next Generation Base Map, July 2004 (500m)","source":"https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/base-map/","unaltered_nasa_jpeg":True,"files":{}}
          fails=[]
          for tile,bounds in [("B1",[-90,0,0,90]),("C1",[0,0,90,90])]:
              name=f"world.200407.3x21600x21600.{tile}.jpg"
              url=base+name
              path=root/name
              success=False
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (ROMA CUB public domain scientific image retrieval)"})
                      with urllib.request.urlopen(req,timeout=150) as response, path.open("wb") as sink:
                          ctype=response.headers.get("Content-Type","")
                          if "image/" not in ctype and "application/octet-stream" not in ctype:raise ValueError("Unexpected MIME: "+ctype)
                          while True:
                              chunk=response.read(1024*1024)
                              if not chunk:break
                              sink.write(chunk)
                      if path.stat().st_size<10_000_000:raise ValueError("Not the original: file too small")
                      with Image.open(path) as im:
                          im.verify()
                      with Image.open(path) as im:
                          if im.size!=(21600,21600) or im.format!="JPEG":raise ValueError("Wrong image dimensions/format "+str(im.size))
                      digest=hashlib.sha256()
                      with path.open("rb") as src:
                          for chunk in iter(lambda:src.read(1024*1024),b""):digest.update(chunk)
                      data["files"][tile]={"status":"verified","filename":name,"source_url":url,"sha256":digest.hexdigest(),"bytes":path.stat().st_size,"width":21600,"height":21600,"bounds_wsen":bounds}
                      success=True
                      print("VERIFIED",tile,path.stat().st_size,digest.hexdigest(),flush=True)
                      break
                  except Exception as exc:
                      print("RETRY",tile,attempt+1,str(exc),flush=True)
                      path.unlink(missing_ok=True)
                      time.sleep(4*(attempt+1))
              if not success:
                  data["files"][tile]={"status":"download_failed","source_url":url}
                  fails.append(tile)
          (root/"NASA_ORIGINALS_MANIFEST.json").write_text(json.dumps(data,indent=2)+"\n")
          if fails:
              raise RuntimeError("Original NASA tiles unavailable: "+", ".join(fails))
          PY
      - name: Upload full ORIGINAL NASA B1 and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROMA_NASA_JULY_500M_ORIGINAL_B1
          path: |
            nasa_originals/world.200407.3x21600x21600.B1.jpg
            nasa_originals/NASA_ORIGINALS_MANIFEST.json
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
      - name: Upload full ORIGINAL NASA C1 and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROMA_NASA_JULY_500M_ORIGINAL_C1
          path: |
            nasa_originals/world.200407.3x21600x21600.C1.jpg
            nasa_originals/NASA_ORIGINALS_MANIFEST.json
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
